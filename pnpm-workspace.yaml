# pnpm 11 reads project settings from here (the package.json "pnpm" field is
# no longer honored). Allow these dependencies to run their install/build
# scripts (Astro needs sharp for image processing; esbuild needs its binary).
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@rive-app/canvas@2.38.1"
  - "@oxfmt/binding-android-arm-eabi@0.73.0"
  - "@oxfmt/binding-android-arm64@0.73.0"
  - "@oxfmt/binding-darwin-arm64@0.73.0"
  - "@oxfmt/binding-darwin-x64@0.73.0"
  - "@oxfmt/binding-freebsd-x64@0.73.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.73.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.73.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.73.0"
  - "@oxfmt/binding-linux-arm64-musl@0.73.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.73.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.73.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.73.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.73.0"
  - "@oxfmt/binding-linux-x64-gnu@0.73.0"
  - "@oxfmt/binding-linux-x64-musl@0.73.0"
  - "@oxfmt/binding-openharmony-arm64@0.73.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.73.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.73.0"
  - "@oxfmt/binding-win32-x64-msvc@0.73.0"
  - oxfmt@0.73.0

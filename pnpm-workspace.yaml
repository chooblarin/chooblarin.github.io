# Astro needs sharp for image processing; esbuild needs its binary.
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@rive-app/canvas@2.38.1"
  - "@voidzero-dev/vite-plus-core@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0"
  - vite-plus@1.4.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
  # Satori still pins the vulnerable release (GHSA-px8p-9vwx-vf98).
  fflate@^0.7.0: 0.7.5
  # Math plugins still require 0.16.x (GHSA-238p-pmpm-9mq7).
  # Keep public/styles/katex assets in sync with this renderer version.
  katex@^0.16.0: 0.18.2
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

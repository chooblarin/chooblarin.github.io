name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check formatting and lint
        run: vp check
      - name: Test
        run: vp run test
      - name: Build
        run: vp run build
      - name: Build Storybook
        run: vp run build-storybook
